# pnpm 11 blocks dependency install scripts unless approved here (pnpm approve-builds).
allowBuilds:
  esbuild: true
# Two transitive dev dependencies with critical advisories and no direct dependency on
# them: tinypool arrives through vitest, shell-quote through react-native's devtools.
# Neither ships in dist/. pnpm 11 reads overrides here rather than from package.json.
overrides:
  tinypool: ">=2.1.2"
  shell-quote: ">=1.11.0"
